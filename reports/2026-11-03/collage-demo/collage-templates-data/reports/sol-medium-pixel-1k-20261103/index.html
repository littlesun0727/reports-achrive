const data=JSON.parse(document.getElementById('data').textContent),p=data.progress;
document.getElementById('stats').textContent=`成功 ${p.succeeded} / ${p.total} · 失败 ${p.failed} · 待处理 ${p.pending} · 重试挽回 ${p.retry_recovered}`;
document.getElementById('updated').textContent=`状态：${p.status} · 第 ${p.round} 轮 · 更新：${new Date(p.updated_at).toLocaleString()}`;
const filter=document.getElementById('filter'),search=document.getElementById('search'),cards=document.getElementById('cards');let page=0,selected=[];const size=36;
const good=c=>['complete','reused'].includes(c.status),el=(tag,text,cls)=>{const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e};
function render(){selected=data.cards.filter(c=>{const f=filter.value;return String(c.id).includes(search.value.trim())&&(f==='all'||f==='success'&&good(c)||f===c.status||f==='recovered'&&good(c)&&c.attempts>1||f==='no_photo'&&good(c)&&!c.counts.photo)});page=Math.max(0,Math.min(page,Math.ceil(selected.length/size)-1));cards.replaceChildren();for(const c of selected.slice(page*size,(page+1)*size)){const box=el('article',null,'card');box.append(el('h3',`#${c.id} · ${good(c)?'解析成功':c.status==='failed'?'失败':'等待解析'}`));box.append(el('p',`轮次 ${c.attempts} · 照片 ${c.counts.photo||0} · 相框 ${c.counts.frame||0} · 文字 ${c.counts.text||0} · 装饰 ${c.counts.overlay||0}`,'muted'));const pair=el('div',null,'pair');for(const [label,url] of [['原图',c.source],['预测框',c.bbox]]){const cell=el('div');cell.append(el('div',label));if(url){const img=el('img');img.src=url;img.loading='lazy';img.alt=`${c.id} ${label}`;cell.append(img)}pair.append(cell)}box.append(pair);if(c.review){const link=el('a','查看大图、对象列表和 JSON');link.href=c.review;link.target='_blank';box.append(link)}if(c.error)box.append(el('p',c.error,'error'));cards.append(box)}document.getElementById('paging').textContent=`${page+1} / ${Math.max(1,Math.ceil(selected.length/size))} 页（${selected.length} 张）`;}
filter.onchange=search.oninput=()=>{page=0;render()};document.getElementById('prev').onclick=()=>{page--;render()};document.getElementById('next').onclick=()=>{page++;render()};render();
